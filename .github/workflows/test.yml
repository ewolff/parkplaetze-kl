name: Run test script

on:
  push:
    branches:
      - "**"   
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6.2
        with:
          python-version: "3.12"


      - name: Run tests
        run: test/test.sh